<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Mr. Wok — Carta</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      touch-action: manipulation;
      font-family: Arial, sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, 177.7777778vh);
      height: min(56.25vw, 100vh);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }
    #slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      display: block;
    }
    #fullscreen {
      position: fixed;
      right: 10px;
      top: max(10px, env(safe-area-inset-top));
      z-index: 50;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 22px;
    }
    #home {
      position: fixed;
      left: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 50;
      border: 0;
      border-radius: 22px;
      padding: 9px 15px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 13px;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
    }
  
    /* ===== CARTA 2.3 — visual effects only, navigation untouched ===== */
    .hotspot{
      -webkit-tap-highlight-color:transparent;
      outline:none;
      transition:transform .14s ease, filter .14s ease;
    }

    /* Visual feedback is behind the transparent hit area and never receives
       pointer events. It does not change coordinates or navigation. */
    .hotspot::before{
      content:"";
      position:absolute;
      inset:3%;
      border-radius:10px;
      pointer-events:none;
      opacity:0;
      border:1px solid rgba(255,255,255,.20);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -3px 5px rgba(0,0,0,.15),
        0 3px 8px rgba(0,0,0,.12);
      transition:opacity .14s ease;
    }

    .hotspot:hover::before,
    .hotspot:focus-visible::before{
      opacity:.65;
    }

    .hotspot:active,
    .hotspot.is-touching{
      transform:scale(.975);
      filter:brightness(.97);
    }

    .hotspot:active::before{
      opacity:.85;
      box-shadow:
        inset 0 3px 6px rgba(0,0,0,.22),
        inset 0 -1px 0 rgba(255,255,255,.08);
    }

    @media (prefers-reduced-motion:reduce){
      .hotspot{transition:none!important}
      .hotspot::before{transition:none!important}
    }


        /* ===== CARTA 3.1 — BOTONES 3D + FLECHAS HTML ===== */
    .hotspot{ -webkit-tap-highlight-color:transparent; outline:none; border:0; padding:0; margin:0; background-repeat:no-repeat; background-color:transparent; background-origin:border-box; box-shadow:none; transition:transform .12s ease,filter .12s ease; isolation:isolate; cursor:pointer; }
    .hotspot::before{ content:""; position:absolute; inset:0; pointer-events:none; border:1px solid rgba(255,255,255,.34); border-radius:inherit; background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.04) 28%,rgba(0,0,0,0) 52%,rgba(0,0,0,.24)); box-shadow:inset 0 2px 0 rgba(255,255,255,.24),inset 2px 0 0 rgba(255,255,255,.08),inset 0 -5px 7px rgba(0,0,0,.28),inset -2px 0 4px rgba(0,0,0,.15),0 3px 7px rgba(0,0,0,.28); }
    .hotspot.circle{clip-path:circle(50% at 50% 50%);border-radius:50%;}.hotspot.circle::before{border-radius:50%;}
    /* Flechas 3.1: botón cuadrado negro con flecha roja */
    .hotspot.arrow-left,.hotspot.arrow-right{
      overflow:hidden!important;
      background:#050505!important;
      background-image:none!important;
      border:1px solid rgba(255,35,35,.75)!important;
      border-radius:10px!important;
      box-shadow:0 4px 0 #320000,0 7px 12px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.10),inset 0 -4px 7px rgba(0,0,0,.45)!important;
      width:11.5%!important;
      height:auto!important;
      aspect-ratio:1 / 1!important;
      top:39.7%!important;
      z-index:30;
    }
    .hotspot.arrow-left::before,.hotspot.arrow-right::before{
      content:"";position:absolute;inset:0;pointer-events:none;border:0!important;border-radius:inherit!important;
      background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,0) 35%,rgba(0,0,0,.18) 75%,rgba(0,0,0,.35));
      box-shadow:inset 0 2px 0 rgba(255,255,255,.10),inset 0 -4px 6px rgba(0,0,0,.28)!important;
    }
    .hotspot.arrow-left::after,.hotspot.arrow-right::after{
      content:"";position:absolute;left:23%;top:30%;width:54%;height:40%;
      background:#e31515;
      filter:drop-shadow(0 2px 0 #720000) drop-shadow(0 3px 3px rgba(0,0,0,.35));
      clip-path:polygon(0 35%,55% 35%,55% 0,100% 50%,55% 100%,55% 65%,0 65%);
      pointer-events:none;
    }
    .hotspot.arrow-left::after{transform:scaleX(-1);}
    .hotspot.arrow-right::after{transform:none;}
    .hotspot.curved-arrow{display:flex;align-items:center;justify-content:center;overflow:visible;background-image:none!important;background:linear-gradient(180deg,#f1cb2e,#cda50a 58%,#8b6b00)!important;border:2px solid #ffe36a;border-radius:14px;color:#171200;font-family:Arial,sans-serif;font-weight:900;font-size:clamp(27px,3.8vw,45px);line-height:1;box-shadow:0 4px 0 #5a4500,0 7px 12px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 6px rgba(0,0,0,.22);}
    .hotspot.curved-arrow::before{content:none;}.hotspot.curved-arrow::after{content:'↶';}
    .hotspot.map-button{overflow:hidden;border-radius:11px;box-shadow:0 3px 0 rgba(65,0,0,.95),0 5px 10px rgba(0,0,0,.35);}.hotspot.map-button::before{border-radius:11px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.025) 35%,rgba(0,0,0,0) 54%,rgba(0,0,0,.18));}
    /* ===== CARTA 3.2 — EFECTO LUPA ===== */
    .hotspot.lens-button{
      overflow:hidden;
      background-repeat:no-repeat;
      background-color:transparent;
      background-origin:border-box;
      background-clip:border-box;
      box-shadow:0 4px 0 rgba(40,0,0,.82),0 7px 14px rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -5px 8px rgba(0,0,0,.24);
    }
    .hotspot.lens-button::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      border-radius:inherit;
      background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.22),rgba(255,255,255,0) 30%);
      border:1px solid rgba(255,255,255,.28);
      box-shadow:inset 0 1px 2px rgba(255,255,255,.2),inset 0 -5px 9px rgba(0,0,0,.22);
    }
    .hotspot.lens-button:active::after,.hotspot.lens-button.is-touching::after{
      background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.28),rgba(255,255,255,0) 32%);
    }
    .hotspot.arrow-left,.hotspot.arrow-right{
      /* Las flechas son botones negros propios: no llevan efecto lupa de imagen. */
    }
    .hotspot:active,.hotspot.is-touching{transform:translateY(2px) scale(.985);filter:brightness(.96);}.hotspot:active::before,.hotspot.is-touching::before{box-shadow:inset 0 4px 7px rgba(0,0,0,.30),inset 0 -1px 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.16);}
    @media (prefers-reduced-motion:reduce){.hotspot{transition:none!important;}}
</style>

    const stage = document.getElementById("stage");
    const slide = document.getElementById("slide");
    const loading = document.getElementById("loading");

    let currentSlide = 1;

    function readSlide() {
      const value = Number.parseInt(window.location.hash.substring(1), 10);
      if (Number.isInteger(value) && value >= 1 && value <= DATA.count) {
        return value;
      }
      return 1;
    }

    function goTo(number) {
      const target = Math.max(1, Math.min(DATA.count, number));
      currentSlide = target;
      window.history.replaceState(null, "", "#" + target);
      draw();
    }

    function getShape(slideNumber, link) {
      const name = link.name || "";

      // Portada: el botón VER CARTA es circular.
      if (slideNumber === 1 && name === "Ver carta") return "circle";

      // Menú de cartas: los dos botones centrales son circulares.
      if (slideNumber === 8 && (name === "Carta entresemana" || name === "Fin de semana y festivos")) {
        return "circle";
      }

      // Botones circulares de navegación de las páginas de carta.
      if (slideNumber >= 9 && slideNumber <= 14 &&
          ["Carne y verduras", "Wok", "Marisco", "Salsas"].includes(name)) {
        return "circle";
      }

      // Flecha amarilla curva de regreso al menú.
      if (name === "Inicio menú") return "curved-arrow";

      // Flechas rojas laterales.
      if (slideNumber >= 2 && slideNumber <= 4 && name === "Inicio") return "arrow-left";
      if (slideNumber >= 5 && slideNumber <= 7 && (name === "Inicio" || name === "Anterior")) return "arrow-left";
      if (slideNumber >= 5 && slideNumber <= 6 && name === "Siguiente") return "arrow-right";

      return "rect";
    }

    function syncButtonImages() {
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const zoom = 1.18;
      document.querySelectorAll(".hotspot[data-x]").forEach((button) => {
        if (button.classList.contains("arrow-left") || button.classList.contains("arrow-right") || button.classList.contains("curved-arrow")) return;
        const x = parseFloat(button.dataset.x) / 100 * sw;
        const y = parseFloat(button.dataset.y) / 100 * sh;
        const w = parseFloat(button.dataset.w) / 100 * sw;
        const h = parseFloat(button.dataset.h) / 100 * sh;
        const scaledW = sw * zoom;
        const scaledH = sh * zoom;
        const posX = -((x + w / 2) * zoom - w / 2);
        const posY = -((y + h / 2) * zoom - h / 2);
        button.style.backgroundSize = scaledW + "px " + scaledH + "px";
        button.style.backgroundPosition = posX + "px " + posY + "px";
      });

      document.querySelectorAll(".map-button[data-x]").forEach((button) => {
        const x = parseFloat(button.dataset.x) / 100 * sw;
        const y = parseFloat(button.dataset.y) / 100 * sh;
        const w = button.offsetWidth;
        const h = button.offsetHeight;
        const scaledW = sw * zoom;
        const scaledH = sh * zoom;
        const posX = -((x + w / 2) * zoom - w / 2);
        const posY = -((y + h / 2) * zoom - h / 2);
        button.style.backgroundSize = scaledW + "px " + scaledH + "px";
        button.style.backgroundPosition = posX + "px " + posY + "px";
      });
    }

    function draw() {
      currentSlide = readSlide();

      document.querySelectorAll(".hotspot").forEach((element) => element.remove());

      slide.src = "slides/" + currentSlide + ".png";

      const links = DATA.links[String(currentSlide)] || [];

      links.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";

        // La zona de toque puede ser rectangular aunque la figura del fondo
        // sea circular o una flecha. El relieve siempre sigue la figura real.
        const shape = getShape(currentSlide, link);
        if (shape) button.classList.add(shape);
        if (shape !== "arrow-left" && shape !== "arrow-right" && shape !== "curved-arrow") {
          button.classList.add("lens-button");
        }

        // Las flechas rojas son algo mayores que la zona original para ocultar
        // completamente el dibujo rojo que existe en el fondo.
        if (shape === "arrow-left" || shape === "arrow-right") {
          // Caja cuadrada negra que tapa completamente la flecha roja del fondo.
          button.style.left = shape === "arrow-left" ? "7.45%" : "81.4%";
          button.style.top = "39.7%";
          button.style.width = "11.5%";
          button.style.height = "auto";
          button.style.aspectRatio = "1 / 1";
        }

        button.setAttribute("aria-label", "Ir a página " + link.target);

        if (shape !== "arrow-left" && shape !== "arrow-right") {
          button.style.left = link.x + "%";
          button.style.top = link.y + "%";
          button.style.width = link.w + "%";
        }
        if (shape !== "arrow-left" && shape !== "arrow-right") {
          if (link.shape === "circle") {
            button.style.height = "auto";
            button.style.aspectRatio = "1 / 1";
          } else {
            button.style.height = link.h + "%";
          }
        }

        // La propia imagen de la diapositiva se usa como fondo del botón,
        // recortada exactamente a la zona del botón.
        button.dataset.x = link.x;
        button.dataset.y = link.y;
        button.dataset.w = link.w;
        button.dataset.h = link.shape === "circle" ? link.w : link.h;
        button.style.backgroundImage = 'url("slides/' + currentSlide + '.png")';

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          goTo(link.target);
        });

        stage.appendChild(button);
      });

      syncButtonImages();

      const externalLinks = DATA.external[String(currentSlide)] || [];

      externalLinks.forEach((link) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot map-button lens-button";
        button.setAttribute("aria-label", link.name || "Abrir enlace");

        button.style.left = link.x + "%";
        button.style.top = link.y + "%";
        button.style.width = link.w + "%";
        button.style.height = link.h + "%";
        button.dataset.x = link.x;
        button.dataset.y = link.y;
        button.style.backgroundImage = 'url("slides/' + currentSlide + '.png")';
        button.style.backgroundRepeat = "no-repeat";

        button.addEventListener("click", function(event) {
          event.preventDefault();
          event.stopPropagation();
          window.location.href = link.url;
        });

        stage.appendChild(button);
      });
    }

    slide.addEventListener("load", function() {
      loading.style.display = "none";
    });

    window.addEventListener("hashchange", draw);
    window.addEventListener("resize", syncButtonImages);

    document.getElementById("home").addEventListener("click", function() {
      goTo(1);
    });

    document.getElementById("fullscreen").addEventListener("click", async function() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        // Algunos móviles no permiten fullscreen desde el navegador.
      }
    });

    // Deslizar también permite cambiar de página.
    let startX = 0;
    let startY = 0;

    stage.addEventListener("touchstart", function(event) {
      const touch = event.changedTouches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    }, { passive: true });

    stage.addEventListener("touchend", function(event) {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;

      if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
        goTo(currentSlide + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    currentSlide = readSlide();
    draw();
  
    document.addEventListener("touchstart", function(event){
      const target = event.target.closest(".hotspot, #home, #fs");
      if (target) target.classList.add("is-touching");
    }, {passive:true});

    document.addEventListener("touchend", function(){
      document.querySelectorAll(".is-touching").forEach(function(el){
        el.classList.remove("is-touching");
      });
    }, {passive:true});

    document.addEventListener("touchcancel", function(){
      document.querySelectorAll(".is-touching").forEach(function(el){
        el.classList.remove("is-touching");
      });
    }, {passive:true});

</script>
</body>
</html>
